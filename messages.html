<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messages | Zorexium Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #181b21; color: #e2e8f0; }
        .message-bubble { word-wrap: break-word; }
    </style>
    <script src="open-links-new-tab.js"></script>
    <script src="cookie-consent.js"></script>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-[#181b21] border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <a href="index.html" class="flex-shrink-0 flex items-center gap-2">
        <div class="text-cyan-400 text-3xl"><i class="fas fa-microchip"></i></div>
        <div class="flex flex-col">
          <span class="text-cyan-400 font-bold text-xl tracking-wide leading-none">ZOREXIUM</span>
          <span class="text-cyan-400 font-medium text-sm tracking-widest leading-none">LABS</span>
        </div>
      </a>
      <div class="flex items-center space-x-4">
        <a href="shopping-cart.html" class="text-gray-300 hover:text-white"><i class="fas fa-shopping-cart text-lg"></i></a>
        <a href="account-details.html" class="text-gray-300 hover:text-white"><i class="fas fa-user-circle text-lg"></i></a>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
  <h1 class="text-4xl font-bold text-white mb-8">Messages</h1>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <!-- Conversations List -->
    <div class="bg-[#20232a] border border-gray-700 rounded-lg overflow-hidden h-96 md:h-screen md:sticky md:top-8">
      <div class="bg-[#181b21] border-b border-gray-700 p-4">
        <h2 class="text-lg font-bold text-white">Conversations</h2>
      </div>
      <div id="conversationsList" class="overflow-y-auto p-4 space-y-2 h-full"></div>
    </div>

    <!-- Chat Area -->
    <div class="md:col-span-3 bg-[#20232a] border border-gray-700 rounded-lg flex flex-col h-96 md:h-screen">
      <!-- Chat Header -->
      <div class="bg-[#181b21] border-b border-gray-700 p-4 flex items-center justify-between">
      <div id="chatHeaderLeft">
          <h2 id="chatHeader" class="text-lg font-bold text-white">Select a conversation</h2>
          <p id="chatSubheader" class="text-gray-400 text-sm">Messages will appear here</p>
        </div>
        <i class="fas fa-envelope text-cyan-400 text-2xl"></i>
      </div>

      <!-- Messages -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[#181b21]">
        <p class="text-gray-400 text-center text-sm">Select a conversation to view messages</p>
      </div>

      <!-- Message Input -->
      <div class="bg-[#181b21] border-t border-gray-700 p-4 space-y-3">
        <div>
          <label class="block text-white text-sm font-semibold mb-2">Subject</label>
          <input type="text" id="msgSubject" placeholder="Message subject" class="w-full bg-[#2a2e38] border border-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400">
        </div>
        <div>
          <label class="block text-white text-sm font-semibold mb-2">Message</label>
          <div class="flex gap-2">
            <textarea id="msgBody" placeholder="Type your message..." rows="2" class="flex-1 bg-[#2a2e38] border border-gray-700 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400 resize-none"></textarea>
            <button onclick="sendCurrentMessage()" class="px-6 py-2 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold rounded-lg self-end">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const BACKEND_URL = 'https://zorexium-backend.onrender.com';
  const PLACEHOLDER_IMG = 'https://placehold.co/40x40/333/fff?text=U';

  let currentUserId = null;
  let currentUser = null;
  let selectedContactId = null;
  let allMessages = [];
  const userInfoCache = {};

  function getUserIdFromToken(token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      return payload.userId || null;
    } catch (e) { return null; }
  }

  async function fetchUserInfo(email) {
    if (userInfoCache[email]) return userInfoCache[email];
        try {
      const res = await fetch(BACKEND_URL + '/api/user/public-info?email=' + encodeURIComponent(email));
      const data = res.ok ? await res.json() : null;
      userInfoCache[email] = {
        displayName: (data && data.displayName) || email,
        profileImage: (data && data.profileImage) || null,
        userId: (data && data.userId) || null
      };
    } catch (_) {
      userInfoCache[email] = { displayName: email, profileImage: null, userId: null };
    }
    return userInfoCache[email];
  }

  async function fetchUserInfoById(userId) {
    if (userInfoCache['id:' + userId]) return userInfoCache['id:' + userId];

    try {
      // Try seller endpoint first
      const res = await fetch(BACKEND_URL + '/api/sellers/user/' + encodeURIComponent(userId));
      if (res.ok) {
        const data = await res.json();
        console.log('=== SELLER ENDPOINT ===');
        console.log('URL:', BACKEND_URL + '/api/sellers/user/' + encodeURIComponent(userId));
        console.log('Full Response:', data);
        console.log('All keys:', Object.keys(data));
        console.log('profileImage:', data.profileImage);
        console.log('profilePicture:', data.profilePicture);
        console.log('image:', data.image);
        console.log('avatar:', data.avatar);
        console.log('photo:', data.photo);

        // Try every possible field that might contain an image
        const imageUrl = data.profileImage || data.profilePicture || data.image ||
                         data.avatar || data.photo || data.profile_image ||
                         data.profile_picture || null;

        userInfoCache['id:' + userId] = {
          displayName: data.shopName || userId,
          profileImage: imageUrl
        };
        console.log('Cached result:', userInfoCache['id:' + userId]);
        return userInfoCache['id:' + userId];
      }
    } catch (e) {
      console.error('Error fetching seller:', e);
    }

    // Fallback: try user info endpoint (auth required)
    try {
      const res = await ZrxSession.fetch(BACKEND_URL + '/api/user/info?userId=' + encodeURIComponent(userId));
      if (res.ok) {
        const data = await res.json();
        console.log('=== USER INFO ENDPOINT ===');
        console.log('URL:', BACKEND_URL + '/api/user/info?userId=' + encodeURIComponent(userId));
        console.log('Full Response:', data);
        console.log('All keys:', Object.keys(data));

        const imageUrl = data.profileImage || data.profilePicture || data.image ||
                         data.avatar || data.photo || data.profile_image ||
                         data.profile_picture || null;

        userInfoCache['id:' + userId] = {
          displayName: data.displayName || userId,
          profileImage: imageUrl
        };
        console.log('Cached result:', userInfoCache['id:' + userId]);
        return userInfoCache['id:' + userId];
      }
    } catch (e) {
      console.error('Error fetching user info:', e);
    }

    // Fallback
    userInfoCache['id:' + userId] = { displayName: userId, profileImage: null };
    console.log('All endpoints failed, using fallback for userId:', userId);
    return userInfoCache['id:' + userId];
  }

  function avatarHtml(profileImage, displayName, size, userId) {
    const s = size || 40;
    const safeName = escapeHtml(displayName);
    const safeSrc = (profileImage && typeof profileImage === 'string' &&
      (profileImage.startsWith('data:image/') ||
       profileImage.startsWith('http://') ||
       profileImage.startsWith('https://')))
      ? profileImage : PLACEHOLDER_IMG;
    const imgHtml = `<img src="${safeSrc}" alt="${safeName}" class="rounded-full object-cover flex-shrink-0" style="width:${s}px;height:${s}px;">`;
    if (userId) {
      return `<a href="seller-profile.html?id=${encodeURIComponent(userId)}" class="hover:opacity-75 transition-opacity cursor-pointer" title="View seller profile">${imgHtml}</a>`;
    }
    return imgHtml;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function init() {
    const token = localStorage.getItem('authToken');
    if (!token) {
      ZrxNotify.showNotification('Please log in', 'info');
      window.location.href = 'signup-login.html';
      return;
    }

    currentUserId = getUserIdFromToken(token);
    if (!currentUserId) {
      ZrxNotify.showNotification('Authentication error', 'error');
      window.location.href = 'signup-login.html';
      return;
    }

    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      currentUser = payload.email || null;
    } catch (e) {
      currentUser = null;
    }

    const params = new URLSearchParams(window.location.search);
    const directContact = params.get('with');

    await loadConversations(directContact);
  }

  async function loadConversations(directContactId) {
        try {
      const res = await ZrxSession.fetch(BACKEND_URL + '/api/messages', {
        credentials: 'include'
      });
      if (res.ok) {
        allMessages = await res.json();
      }
    } catch (_) {
      allMessages = [];
    }

    // Build unique conversations (by other party's userId)
    const conversations = {};
    allMessages.forEach(msg => {
      const otherId = msg.fromUserId === currentUserId ? msg.toUserId : msg.fromUserId;
      if (!conversations[otherId]) conversations[otherId] = [];
      conversations[otherId].push(msg);
    });

    if (directContactId && !conversations[directContactId]) {
      conversations[directContactId] = [];
    }

    await renderConversations(conversations);
    if (directContactId) selectContact(directContactId);
  }

  async function renderConversations(conversations) {
    const list = document.getElementById('conversationsList');
    list.innerHTML = '';

    if (Object.keys(conversations).length === 0) {
      list.innerHTML = '<p class="text-gray-400 text-sm">No conversations yet</p>';
      return;
    }

    for (const contactId of Object.keys(conversations)) {
      const info = await fetchUserInfoById(contactId);
      const button = document.createElement('button');
      button.className = 'w-full text-left px-3 py-2 hover:bg-[#2a2e38] rounded transition-colors text-white flex items-center gap-2';
      button.innerHTML = `${avatarHtml(info.profileImage, info.displayName, 32, contactId)}<span class="truncate">${escapeHtml(info.displayName)}</span>`;
      button.onclick = () => selectContact(contactId);
      list.appendChild(button);
    }
  }

  async function selectContact(contactId) {
    selectedContactId = contactId;

    const info = await fetchUserInfoById(contactId);
    const headerLeft = document.getElementById('chatHeaderLeft');

    headerLeft.innerHTML = `
      <div class="flex items-center gap-3">
        ${avatarHtml(info.profileImage, info.displayName, 40, contactId)}
        <div>
          <h2 class="text-lg font-bold text-white">${escapeHtml(info.displayName)}</h2>
          <p class="text-gray-400 text-sm">Conversation with ${escapeHtml(info.displayName)}</p>
        </div>
      </div>
    `;

    const msgs = allMessages.filter(msg =>
      (msg.fromUserId === currentUserId && msg.toUserId === contactId) ||
      (msg.fromUserId === contactId && msg.toUserId === currentUserId)
    );
    renderMessages(msgs, info);
  }

  function renderMessages(msgs, contactInfo) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';

    if (msgs.length === 0) {
      container.innerHTML = '<p class="text-gray-400 text-center">No messages yet. Start the conversation!</p>';
      return;
    }

    msgs.forEach(msg => {
      const isOwn = msg.fromUserId === currentUserId;
      const div = document.createElement('div');
      div.className = `flex ${isOwn ? 'justify-end' : 'justify-start'} items-end gap-2`;
      if (isOwn) {
        div.innerHTML = `
          <div class="max-w-xs message-bubble bg-cyan-600 text-white rounded-lg p-3">
            <p class="text-xs opacity-75 mb-1">${escapeHtml(msg.subject || '')}</p>
            <p class="break-words">${escapeHtml(msg.body)}</p>
            <p class="text-xs opacity-50 mt-2">${new Date(msg.createdAt).toLocaleString()}</p>
          </div>
        `;
      } else {
        div.innerHTML = `
          ${avatarHtml(contactInfo.profileImage, contactInfo.displayName, 32, selectedContactId)}
          <div class="max-w-xs message-bubble bg-gray-700 text-white rounded-lg p-3">
            <p class="text-xs font-semibold text-cyan-400 mb-1">${escapeHtml(contactInfo.displayName)}</p>
            <p class="text-xs opacity-75 mb-1">${escapeHtml(msg.subject || '')}</p>
            <p class="break-words">${escapeHtml(msg.body)}</p>
            <p class="text-xs opacity-50 mt-2">${new Date(msg.createdAt).toLocaleString()}</p>
          </div>
        `;
      }
      container.appendChild(div);
    });

    container.scrollTop = container.scrollHeight;
  }

  async function sendCurrentMessage() {
    if (!selectedContactId) {
      ZrxNotify.showNotification('Select a conversation first', 'info');
      return;
    }

    const subject = document.getElementById('msgSubject').value.trim();
    const body = document.getElementById('msgBody').value.trim();

    if (!subject || !body) {
      ZrxNotify.showNotification('Please fill in all fields', 'error');
      return;
    }

        try {
      const res = await ZrxSession.fetch(BACKEND_URL + '/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ toUserId: selectedContactId, subject, body })
      });
      if (res.ok) {
        document.getElementById('msgSubject').value = '';
        document.getElementById('msgBody').value = '';
        // Reload conversations and re-select
        await loadConversations(selectedContactId);
      } else {
        const data = await res.json();
        ZrxNotify.showNotification(data.error || 'Failed to send message', 'error');
      }
    } catch (_) {
      ZrxNotify.showNotification('Network error. Please try again.', 'error');
    }
  }

  init();
</script>

<script src="notifications.js"></script>
<script src="session.js"></script>

</body>
</html>
