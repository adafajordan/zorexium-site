<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart - Zorexium Labs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #181b21; color: #e2e8f0; }
    .nav-dropdown { opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease; }
    .nav-dropdown-trigger:hover .nav-dropdown, .nav-dropdown-trigger.active .nav-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .cart-item { background-color: #20232a; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .summary-box { background-color: #20232a; border: 1px solid #333; border-radius: 8px; padding: 20px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Top Navigation -->
<header class="bg-[#181b21] border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center">
        <a href="index.html" class="flex-shrink-0 flex items-center gap-2">
          <div class="text-cyan-400 text-3xl"><i class="fas fa-microchip"></i></div>
          <div class="flex flex-col">
            <span class="text-cyan-400 font-bold text-xl tracking-wide leading-none">ZOREXIUM</span>
            <span class="text-cyan-400 font-medium text-sm tracking-widest leading-none">LABS</span>
          </div>
        </a>
      </div>
      <nav class="hidden md:flex space-x-8">
        <a href="marketplace.html" class="text-cyan-400 hover:text-white px-3 py-2 rounded-md text-sm font-medium border-b-2 border-cyan-400">Marketplace</a>
        <a href="community-hub.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Community</a>
        <a href="sell-hardware.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Sell</a>
      </nav>
      <div class="flex items-center space-x-4">
        <a href="shopping-cart.html" class="text-cyan-400 hover:text-white relative"><i class="fas fa-shopping-cart text-lg"></i><span id="cartBadge" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span></a>
        <a href="account-details.html" class="text-gray-300 hover:text-white"><i class="fas fa-user-circle text-lg"></i></a>
        <a href="account-details.html" class="h-8 w-8 rounded-full overflow-hidden border border-gray-600 inline-block"><img src="https://placehold.co/100x100/333/fff?text=U" alt="User Profile" class="h-full w-full object-cover"></a>
      </div>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-white mb-2">Shopping Cart</h1>
    <p class="text-gray-400">Review and checkout your items</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Cart Items -->
    <div class="lg:col-span-2">
      <div id="cartItems" class="space-y-4">
        <div class="text-center py-12">
          <i class="fas fa-shopping-cart text-5xl text-gray-600 mb-4 block"></i>
          <p class="text-gray-400 mb-4">Your cart is empty</p>
          <a href="marketplace.html" class="inline-block px-6 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-semibold">
            Continue Shopping
          </a>
        </div>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="lg:col-span-1">
      <div class="summary-box sticky top-20">
        <h2 class="text-xl font-bold text-white mb-6">Order Summary</h2>
        
        <div class="space-y-4 mb-6">
          <div class="flex justify-between text-gray-400">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="flex justify-between text-gray-400">
            <span>Shipping</span>
            <span id="shipping">$0.00</span>
          </div>
          <div class="flex justify-between text-gray-400">
            <span>Tax</span>
            <span id="tax">$0.00</span>
          </div>
          <div class="border-t border-gray-700 pt-4">
            <div class="flex justify-between text-white text-lg font-bold">
              <span>Total</span>
              <span id="total">$0.00</span>
            </div>
          </div>
        </div>

        <button onclick="proceedToCheckout()" class="w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold mb-3">
          <i class="fas fa-credit-card"></i> Proceed to Checkout
        </button>
        <a href="marketplace.html" class="block w-full text-center px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-semibold">
          Continue Shopping
        </a>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-[#131620] border-t border-gray-800 mt-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="border-t border-gray-800 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-2"><i class="fas fa-microchip text-cyan-400 text-lg"></i><span class="text-white font-semibold text-sm">ZOREXIUM LABS</span></div>
      <p class="text-gray-500 text-xs text-center md:text-right">&copy; 2026 Zorexium Labs. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="notifications.js"></script>
<script>
  let cart = JSON.parse(localStorage.getItem('zorexiumCart') || '[]');

  function loadCart() {
    const cartItemsDiv = document.getElementById('cartItems');
    
    if (cart.length === 0) {
      cartItemsDiv.innerHTML = `
        <div class="text-center py-12">
          <i class="fas fa-shopping-cart text-5xl text-gray-600 mb-4 block"></i>
          <p class="text-gray-400 mb-4">Your cart is empty</p>
          <a href="marketplace.html" class="inline-block px-6 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-semibold">
            Continue Shopping
          </a>
        </div>
      `;
      updateSummary();
      return;
    }

    cartItemsDiv.innerHTML = cart.map((item, index) => `
      <div class="cart-item">
        <div class="flex gap-4">
          <img src="${item.image || 'https://placehold.co/100x100/333/fff?text=Product'}" alt="${item.name}" class="w-24 h-24 object-cover rounded-lg">
          <div class="flex-1">
            <h3 class="text-white font-semibold text-lg">${item.name}</h3>
            <p class="text-gray-400 text-sm mb-2">From: ${item.sellerName || 'Unknown Seller'}</p>
            <p class="text-cyan-400 font-bold text-lg mb-3">$${item.price}</p>
            <div class="flex items-center gap-2">
              <button onclick="updateQuantity(${index}, -1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded">−</button>
              <input type="number" value="${item.quantity}" min="1" onchange="setQuantity(${index}, this.value)" class="w-12 bg-gray-700 text-white text-center rounded px-2 py-1">
              <button onclick="updateQuantity(${index}, 1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded">+</button>
              <button onclick="removeFromCart(${index})" class="ml-auto px-4 py-1 bg-red-900 hover:bg-red-800 text-red-300 rounded text-sm">Remove</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');

    updateSummary();
  }

  function updateQuantity(index, change) {
    cart[index].quantity += change;
    if (cart[index].quantity < 1) cart[index].quantity = 1;
    localStorage.setItem('zorexiumCart', JSON.stringify(cart));
    loadCart();
  }

  function setQuantity(index, value) {
    const qty = parseInt(value) || 1;
    if (qty < 1) return;
    cart[index].quantity = qty;
    localStorage.setItem('zorexiumCart', JSON.stringify(cart));
    loadCart();
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem('zorexiumCart', JSON.stringify(cart));
    loadCart();
  }

  function updateSummary() {
    const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    const shipping = cart.length > 0 ? 10 : 0;
    const tax = subtotal * 0.08;
    const total = subtotal + shipping + tax;

    document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('shipping').textContent = '$' + shipping.toFixed(2);
    document.getElementById('tax').textContent = '$' + tax.toFixed(2);
    document.getElementById('total').textContent = '$' + total.toFixed(2);

    const badge = document.getElementById('cartBadge');
    const count = cart.length;
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function proceedToCheckout() {
    if (cart.length === 0) {
      ZrxNotify.showNotification('Your cart is empty', 'info');
      return;
    }
    window.location.href = 'checkout.html';
  }

  window.addEventListener('load', loadCart);
</script>

</body>
</html>
