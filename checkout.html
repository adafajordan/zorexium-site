<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <script src='https://www.paypal.com/sdk/js?client-id=AeaN6FJEAVPXsXpwHP0RAVBZ-rinzyOBi0Wbzwl5MBb7joTYRj23Ttj2K3SpAnsieeTpUvzylWmKUGhk&currency=USD'></script>
</head>
<body>
    <h1>Checkout</h1>
    <div id="contact-info">
        <h2>Contact Info</h2>
        <!-- existing contact info section goes here -->
    </div>
    <div id="shipping-info">
        <h2>Shipping Address</h2>
        <!-- existing shipping address section goes here -->
    </div>
    <div id="shipping-method">
        <h2>Shipping Method</h2>
        <!-- existing shipping method section goes here -->
    </div>
    <div id="paypal-button-container"></div>
    <script>
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '0.01' // Replace with total calculation
                        }
                    }],
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Transaction completed by ' + details.payer.name.given_name);
                });
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
